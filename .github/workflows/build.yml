name: Build OpenWrt 25.12

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"
  push:
    branches: [master]
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "seed/**"

permissions:
  contents: write
  actions: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget libelf-dev qemu-utils ccache

      - name: Clone OpenWrt 25.12
        run: git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt

      - name: Prepare tree and extra packages
        run: |
          cd openwrt
          bash ../scripts/prepare.sh

      - name: Configure
        run: |
          cd openwrt
          cp ../seed/rockchip.seed .config
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} + || true

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          shopt -s nullglob
          cp -v openwrt/bin/targets/rockchip/armv8/*sysupgrade* artifact/ || true
          cp -v openwrt/bin/targets/rockchip/armv8/*.img* artifact/ || true
          (cd openwrt && ./scripts/diffconfig.sh > ../artifact/config.diff)
          ls -lah artifact
          test -n "$(ls -A artifact/*sysupgrade* 2>/dev/null)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-rockchip-25.12
          path: artifact/

      - name: Publish release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: openwrt-25.12
          name: OpenWrt 25.12
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifacts: artifact/*
          bodyFile: body-origin.md
