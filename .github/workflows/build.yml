name: Build ImmortalWrt 25.12

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"
  push:
    branches: [master]
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "seed/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: immortalwrt-rockchip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          echo -e "CPU\t: $(nproc)"
          lscpu | awk -F: '/Model name/ {print "Model\t:" $2}'
          free -h
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget libelf-dev \
            qemu-utils ccache

      - name: Clone ImmortalWrt 25.12
        run: |
          git clone --depth 1 -b openwrt-25.12 \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          echo "IWRT_REV=$(git -C openwrt rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y.%m.%d)" >> "$GITHUB_ENV"
          git -C openwrt log -1 --oneline

      - name: Update ImmortalWrt feeds
        run: |
          cd openwrt
          bash ../scripts/prepare.sh

      - name: Configure
        run: |
          cd openwrt
          cp ../seed/rockchip.seed .config
          make defconfig
          ./scripts/diffconfig.sh | tee ../artifact-config.diff || true

      - name: Verify required packages
        run: |
          set -euo pipefail
          cfg=openwrt/.config
          missing=0
          for sym in \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_luci-app-homeproxy \
            CONFIG_PACKAGE_luci-app-passwall \
            CONFIG_PACKAGE_luci-app-smartdns \
            CONFIG_PACKAGE_tailscale \
            CONFIG_PACKAGE_luci-app-tailscale-community \
            CONFIG_PACKAGE_odhcp6c \
            CONFIG_PACKAGE_odhcpd-ipv6only \
            CONFIG_PACKAGE_luci-proto-ipv6
          do
            if ! grep -q "^${sym}=y" "$cfg"; then
              echo "MISSING ${sym}"
              missing=1
            else
              echo "OK ${sym}"
            fi
          done
          exit "$missing"

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -type f -size -1024c -print -delete || true

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          shopt -s nullglob
          dest=openwrt/bin/targets/rockchip/armv8
          cp -v "$dest"/*sysupgrade* artifact/ || true
          cp -v "$dest"/sha256sums artifact/ || true
          cp openwrt/.config artifact/full.config
          (cd openwrt && ./scripts/diffconfig.sh > ../artifact/config.diff)
          ls -lah artifact
          test -n "$(echo artifact/*sysupgrade*)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rockchip-25.12
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        run: |
          {
            echo "ImmortalWrt 25.12 firmware — ${BUILD_DATE}"
            echo
            cat body-origin.md
            echo
            echo "ImmortalWrt revision: ${IWRT_REV}"
            echo "Builder: ${GITHUB_SHA}"
          } > release-body.md

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          tag: immortalwrt-25.12
          name: ImmortalWrt 25.12
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifacts: artifact/*
          bodyFile: release-body.md
